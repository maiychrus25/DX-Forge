  <text x="324" y="204" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#CBD5E1">Bộ biên dịch Hệ điều hành Doanh nghiệp số</text>
  <text x="324" y="244" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="20" fill="#94A3B8">measure → interview → plan → apply → verify → handbook</text>
