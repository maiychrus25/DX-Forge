  <g class="icon" transform="translate(79 17)"><path d="m14 1 11 4v9c0 7-11 13-11 13S3 21 3 14V5zM8 13l4 4 8-9"/></g>
  <text class="label" x="93" y="80">verify</text><text class="file" x="93" y="141">report</text>
</g>
<g transform="translate(1201 192)" color="#f472b6">
  <rect class="shell" width="186" height="110" rx="13"/><rect class="lit" style="animation-delay:-1.5s" width="186" height="110" rx="13"/>
  <g class="icon" transform="translate(79 17)"><path d="M14 6Q8 1 2 4v21q6-3 12 1 6-4 12-1V4q-6-3-12 2v20"/></g>
  <text class="label" x="93" y="80">handbook</text><text class="file" x="93" y="141">Resources/00. Portal</text>
</g>
<g class="pulse">
  <circle r="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.091667;.166667;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><animateMotion path="M237 247H281" keyPoints="0;0;1;1" keyTimes="0;.091667;.166667;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
  <circle r="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.258333;.333333;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><animateMotion path="M467 247H511" keyPoints="0;0;1;1" keyTimes="0;.258333;.333333;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
  <circle r="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.425;.5;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><animateMotion path="M697 247H741" keyPoints="0;0;1;1" keyTimes="0;.425;.5;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
  <circle r="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.591667;.666667;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><animateMotion path="M927 247H971" keyPoints="0;0;1;1" keyTimes="0;.591667;.666667;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
  <circle r="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.758333;.833333;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><animateMotion path="M1157 247H1201" keyPoints="0;0;1;1" keyTimes="0;.758333;.833333;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
  <circle r="3" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;.925;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><animateMotion path="M1294 302V419Q1294 439 1274 439H164Q144 439 144 419V302" keyPoints="0;0;1" keyTimes="0;.925;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
</g>
<text x="720" y="478" text-anchor="middle" font-size="12" fill="#62728a" letter-spacing="1">ĐO LƯỜNG LẠI · TIẾP TỤC CẢI TIẾN</text>
