<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">DX-Forge · Chu trình cải tiến</title>
<desc id="desc">Sáu bước measure, interview, plan, apply, verify, handbook. Mỗi bước sáng khi tín hiệu tới, sau đó trở lại measure. Chu kỳ chín giây.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#050810"/><stop offset="1" stop-color="#090b17"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".035"/><stop offset="1" stop-color="#ffffff" stop-opacity=".008"/></linearGradient>
  <filter id="glow" x="-50%" y="-60%" width="200%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fb0cf" stroke-opacity=".025"/></pattern>
  <style>
    text {font-family:Inter,system-ui,sans-serif}
    .label {font-size:22px;font-weight:650;fill:#cbd5e1;text-anchor:middle}
    .file {font-family:ui-monospace,Consolas,monospace;font-size:13px;fill:#758499;text-anchor:middle}
    .step {font-size:11px;letter-spacing:2px;fill:#66758c}
    .shell {fill:#0b111d;stroke:#263144;stroke-width:1}
    .icon {fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
    .lit {fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-width:1.5;filter:url(#glow);opacity:0;animation:light 9s linear infinite}
    .pulse {fill:#d5fff5;filter:url(#glow)}
    @keyframes light {0%,8.7%{opacity:1}9.2%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.lit{animation:none;opacity:.25}.pulse{display:none}}
  </style>
</defs>
<rect width="1440" height="520" rx="20" fill="url(#background)"/>
<rect width="1440" height="520" rx="20" fill="url(#grid)"/>
<text x="54" y="60" fill="#e2e8f0" font-size="23" font-weight="700" letter-spacing="1">DX-FORGE</text>
<text x="54" y="87" fill="#65748b" font-size="13">Chu trình cải tiến liên tục</text>
<g fill="url(#panel)" stroke="#ffffff" stroke-opacity=".055">
  <rect x="40" y="120" width="436" height="267" rx="16"/>
  <rect x="502" y="120" width="436" height="267" rx="16"/>
  <rect x="964" y="120" width="436" height="267" rx="16"/>
</g>
<g class="step"><text x="60" y="148">01 / KHẢO SÁT</text><text x="522" y="148">02 / TRIỂN KHAI</text><text x="984" y="148">03 / KIỂM CHỨNG</text></g>
<g fill="none" stroke="#344156" stroke-width="1.5">
  <path d="M237 247H281M467 247H511M697 247H741M927 247H971M1157 247H1201"/>
  <path d="M1294 302V419Q1294 439 1274 439H164Q144 439 144 419V302" stroke-dasharray="4 6" stroke-opacity=".6"/>
</g>
