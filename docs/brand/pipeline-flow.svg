</g>
<g transform="translate(511 192)" color="#fbbf24">
  <rect class="shell" width="186" height="110" rx="13"/><rect class="lit" style="animation-delay:-6s" width="186" height="110" rx="13"/>
  <g class="icon" transform="translate(79 17)"><path d="M5 2h19v25H5zM9 9h10M9 15h10M9 21h6"/></g>
  <text class="label" x="93" y="80">plan</text><text class="file" x="93" y="141">plan.yaml</text>
</g>
<g transform="translate(741 192)" color="#34d399">
  <rect class="shell" width="186" height="110" rx="13"/><rect class="lit" style="animation-delay:-4.5s" width="186" height="110" rx="13"/>
  <g class="icon" transform="translate(79 17)"><path d="m4 7 8 7-8 7M16 22h10"/></g>
  <text class="label" x="93" y="80">apply</text><text class="file" x="93" y="141">state.json</text>
</g>
<g transform="translate(971 192)" color="#60a5fa">
