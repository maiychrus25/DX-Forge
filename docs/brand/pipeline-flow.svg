<g transform="translate(51 192)" color="#22d3ee">
  <rect class="shell" width="186" height="110" rx="13"/><rect class="lit" width="186" height="110" rx="13"/>
  <g class="icon" transform="translate(79 17)"><path d="M1 25V13M9 25V5M17 25V17M25 25V1"/></g>
  <text class="label" x="93" y="80">measure</text><text class="file" x="93" y="141">ResultV1</text>
</g>
<g transform="translate(281 192)" color="#a78bfa">
  <rect class="shell" width="186" height="110" rx="13"/><rect class="lit" style="animation-delay:-7.5s" width="186" height="110" rx="13"/>
  <g class="icon" transform="translate(79 17)"><path d="M2 3h24v17H13l-7 6v-6H2zM8 9h12M8 14h8"/></g>
