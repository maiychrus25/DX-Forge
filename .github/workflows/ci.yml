# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: SPDX headers present
        run: |
          missing=$(grep -rL "SPDX-License-Identifier: AGPL-3.0-or-later" --include='*.ts' --include='*.tsx' --include='*.sql' --exclude-dir=dist --exclude-dir=node_modules packages apps || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }
